<!doctype html><meta charset='utf-8'><title>MONITOR CL 👀</title><style>body{font:14px Segoe UI;margin:0;background:#f5f6f8}header{background:#222;color:white;padding:18px}main{max-width:850px;margin:auto;padding:20px}.c{background:white;padding:18px;margin:12px 0;border-radius:8px}label{display:block;font-weight:600;margin:8px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:8px}textarea{min-height:130px}button{padding:9px 15px;margin:6px}</style><header><b>MONITOR CL 👀</b></header><main><div class=c><label>URL Programadas</label><input id=s><label>URL Abiertas</label><input id=o><label>Intervalo Programadas (segundos)</label><input id=si type=number><label>Intervalo Abiertas (minutos)</label><input id=oi type=number></div><div class=c><label>Exclusiones (una por línea)</label><textarea id=e></textarea><label>Prioridades (una por línea)</label><textarea id=p></textarea></div><div class=c><button onclick='save()'>GUARDAR</button><button onclick='reset()'>RESTAURAR</button><button onclick='api.testSound()'>PROBAR SONIDO</button></div></main><script>let c;const $=x=>document.getElementById(x);async function load(){c=await api.getConfig();s.value=c.scheduledUrl;o.value=c.openUrl;si.value=c.scheduledInterval/1000;oi.value=c.openInterval/60000;e.value=c.exclusions.join('\n');p.value=c.priorities.join('\n')}async function save(){c.scheduledUrl=s.value;c.openUrl=o.value;c.scheduledInterval=Math.max(10,+si.value)*1000;c.openInterval=Math.max(1,+oi.value)*60000;c.exclusions=e.value.split('\n').filter(Boolean);c.priorities=p.value.split('\n').filter(Boolean);await api.saveConfig(c);alert('Guardado y aplicado')}async function reset(){if(confirm('Restaurar configuración original?')){c=await api.resetConfig();load()}}load()</script>
